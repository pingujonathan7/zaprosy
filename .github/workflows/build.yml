name: Сборка macOS-приложения

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Собрать icon.icns из icon.png
        run: |
          rm -rf icon.iconset
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
          ls -la icon.icns

      - name: Собрать .app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name Zaprosy \
            --icon icon.icns \
            --osx-bundle-identifier com.zaprosy.pad \
            zaprosy.py

      - name: Подписать и переименовать
        run: |
          APP="dist/Zaprosy.app"
          PL="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Запросы" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Запросы" "$PL" \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Запросы" "$PL"
          /usr/libexec/PlistBuddy -c "Set :NSHighResolutionCapable true" "$PL" || true
          mv "$APP" "dist/Запросы.app"
          codesign --force --deep --sign - "dist/Запросы.app"
          codesign --verify --verbose "dist/Запросы.app"

      - name: Упаковать в zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Запросы.app" Zaprosy-macOS.zip
          ls -la Zaprosy-macOS.zip

      - name: Положить сборку в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Zaprosy-macOS
          path: Zaprosy-macOS.zip

      - name: Выложить релиз (только для тега)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Сборка «Запросы» для macOS (Apple Silicon). Распакуй и перетащи в Программы." \
            || echo "релиз уже существует, добавляю файл"
          gh release upload "$GITHUB_REF_NAME" Zaprosy-macOS.zip --clobber
